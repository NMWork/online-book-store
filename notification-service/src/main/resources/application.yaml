spring:
  application:
    name: notification-service

  kafka:
    bootstrap-servers: localhost:9092
    template:
      default-topic: order-events
    listener:
      ack-mode: RECORD

    consumer:
      group-id: notification-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.microservices.onlinebookstore.notificationservice.event"
        spring.json.value.default.type: "com.microservices.onlinebookstore.notificationservice.event.OrderCreatedEvent"
        spring.json.use.type.headers: false
      enable-auto-commit: false

server:
  port: 8088

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    prefer-ip-address: true